<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>وحدة الذكاء الاصطناعي الذاتية</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>مهندس الذكاء الاصطناعي الذاتي</h1>
      <p class="muted">لوحة تحكم تفاعلية لعرض سجلات الوكيل واختيار النموذج وإرسال أوامر</p>
    </header>

    <section class="controls">
      <label>اختر المزود</label>
      <select id="provider">
        <option value="huggingface">Hugging Face</option>
        <option value="replicate">Replicate</option>
        <option value="ollama">Ollama</option>
        <option value="http">Generic HTTP</option>
      </select>

      <label>اسم النموذج</label>
      <input id="model" placeholder="مثال: meta-llama/Llama-3-70b" />

      <label>أمر أو سؤال</label>
      <input id="cmd" placeholder="ask: اشرح حالة المستودع أو run: pytest" />

      <div class="buttons">
        <button id="send">إرسال</button>
        <button id="open-logs">عرض السجلات</button>
      </div>
    </section>

    <section id="log" class="log" aria-live="polite"></section>

    <footer>
      <small>ملاحظة: لا يتم تطبيق تغييرات تلقائياً. كل اقتراح يُحفظ للمراجعة البشرية.</small>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
