name: Autonomous AI Engineer Agent

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  autonomous-agent:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare env
        run: |
          # اكتب المتغيرات الآمنة إلى ملف البيئة ليتم استخدامها في الخطوات التالية
          echo "MODEL_PROVIDER=${{ secrets.MODEL_PROVIDER }}" >> $GITHUB_ENV
          echo "MODEL_NAME=${{ secrets.MODEL_NAME }}" >> $GITHUB_ENV
          echo "MODEL_API_KEY=${{ secrets.MODEL_API_KEY }}" >> $GITHUB_ENV
          echo "MODEL_API_URL=${{ secrets.MODEL_API_URL }}" >> $GITHUB_ENV
          echo "AGENT_HUMAN_APPROVAL=${{ secrets.AGENT_HUMAN_APPROVAL }}" >> $GITHUB_ENV
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Lint and Build Precheck
        id: precheck
        run: |
          set -e
          # Python lint (إن كان مثبتاً)
          if command -v flake8 >/dev/null 2>&1; then
            flake8 || true
          fi
          # Frontend build إذا وُجد package.json
          if [ -f package.json ]; then
            if command -v npm >/dev/null 2>&1; then
              npm ci || true
              npm run build || true
            fi
          fi
          echo "precheck=done" >> $GITHUB_OUTPUT

      - name: Run Autonomous Agent
        id: run_agent
        env:
          MODEL_PROVIDER: ${{ env.MODEL_PROVIDER }}
          MODEL_NAME: ${{ env.MODEL_NAME }}
          MODEL_API_KEY: ${{ env.MODEL_API_KEY }}
          MODEL_API_URL: ${{ env.MODEL_API_URL }}
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          AGENT_HUMAN_APPROVAL: ${{ env.AGENT_HUMAN_APPROVAL }}
        run: |
          python agent.py --mode=autonomous

      - name: Upload Agent Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-logs
          path: ./agent_logs/*.log
