name: Autonomous AI Engineer Agent

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  autonomous-agent:
    runs-on: ubuntu-latest
    environment: production
    env:
      MODEL_PROVIDER: ${{ secrets.MODEL_PROVIDER }}
      MODEL_NAME: ${{ secrets.MODEL_NAME }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      MODEL_API_URL: ${{ secrets.MODEL_API_URL }}
      AGENT_HUMAN_APPROVAL: ${{ secrets.AGENT_HUMAN_APPROVAL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint and Build Precheck
        id: precheck
        run: |
          set -e
          # Python lint (إن وُجد)
          if command -v flake8 >/dev/null 2>&1; then
            flake8 || true
          fi
          # Frontend build إذا وُجد package.json
          if [ -f package.json ]; then
            if command -v npm >/dev/null 2>&1; then
              npm ci || true
              npm run build || true
            fi
          fi
          echo "precheck=done" >> $GITHUB_OUTPUT

      - name: Run Autonomous Agent
        id: run_agent
        run: |
          python agent.py --mode=autonomous

      - name: Upload Agent Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-logs
          path: ./agent_logs/*.log
