name: AI Autonomous Builder & DB Initializer

on:
  workflow_dispatch:

jobs:
  run-builder:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies & Chat Tools
        run: |
          npm install -g aider-chat
          if [ -f package.json ]; then npm install; fi

      - name: Execute Automated Interactive Deployment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 1. كتابة التوجيهات البرمجية داخل ملف نصي معزول تماماً لحماية الرموز والأكواد من الانهيار
          cat << 'EOF' > ai_instructions.txt
          CRITICAL INTEGRATED TASK — ZERO ROOM FOR ERROR:
          
          1. STRUCTURE INSPECTION: Scan the repository immediately to identify the exact Next.js setup (App Router or Pages Router, with or without 'src/' directory).
          
          2. API ROUTE CREATION: Create a fully functioning database initialization API endpoint named 'init-db' in the precise directory discovered.
          
          3. DATABASE LOGIC: Inside this endpoint, implement the code to connect directly to Supabase using the live environment variables. The code must execute SQL queries to:
             - Check and create the 'trade_knowledge_hub' table if it does not exist.
             - Inject the 19 massive strategic trade knowledge/source rows completely and safely.
             
          4. VALIDATION: Ensure the project compiles successfully with no TypeScript or build errors.
          
          5. COMMIT & PUSH: Automatically commit all created files and push them directly to the master branch.
          EOF

          # 2. تشغيل المطور الآلي بقراءة الملف النصي وتنفيذ المهمة بأعلى صلاحيات للسيرفر
          aider --message-file ai_instructions.txt --auto-commit --yes

      - name: Execution Success Report
        run: |
          echo "=========================================================="
          echo "🎉 SUCCESS: The AI Builder has finished processing!"
          echo "🌍 Production URL: https://nile-key3.vercel.app/api/init-db"
          echo "=========================================================="
