name: Nile-Key Autonomous AI Builder

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'AI Task Description'
        required: true
      model_choice:
        description: 'Choose Model'
        required: true
        default: 'gemini-2.5-flash'
        type: choice
        options:
          - gemini-2.5-flash
          - gemini-2.5-pro
      run_lint:
        description: 'Run build check?'
        required: true
        default: true
        type: boolean

jobs:
  build-and-code:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ضروري جداً لتمكين عمليات الدمج ومعرفة تاريخ الـ Commits

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install aider-chat litellm
          npm install

      - name: Execute AI Task
        env:
          # استبدال هجينج فيس بـ Gemini المستقر والمجاني للمشاريع الكبيرة
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AIDER_MODEL: ${{ github.event.inputs.model_choice == 'gemini-2.5-flash' && 'gemini/gemini-2.5-flash' || 'gemini/gemini-2.5-pro' }}
        run: |
          aider --message "${{ github.event.inputs.task }}" --auto-commit --yes

      - name: Quality Check
        if: ${{ github.event.inputs.run_lint == 'true' || github.event.inputs.run_lint == true }}
        env:
          # تخطي فحص بيئة السيرفر أثناء بناء Next.js لضمان عدم انهيار الـ Build
          SUPABASE_URL: "https://placeholder-url.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder-key"
        run: |
          npm run build || (echo "Broken code detected! Reverting..." && git checkout .)

      - name: Push to Repository
        run: |
          git config --global user.name "Nile-Key-AI-Bot"
          git config --global user.email "bot@nile-key.com"
          
          # جلب أي تحديثات جديدة تمت على السيرفر أثناء تشغيل الـ Runner
          git fetch origin master
          
          # دمج التحديثات مع الكود الذي كتبه البوت الآن داخل الـ Detached HEAD
          git rebase origin/master
          
          # الحل الحاسم: دفع الـ HEAD الحالي الذي يحتوي على التعديلات مباشرة إلى فرع master
          git push origin HEAD:master
