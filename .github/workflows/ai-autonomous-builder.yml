name: AI Autonomous Builder & DB Initializer

on:
  workflow_dispatch:
    inputs:
      task_description:
        description: 'AI Task Description'
        required: true
        type: string
        default: 'Create init-db API route to connect to Supabase and initialize trade_knowledge_hub table with 19 seed rows.'
      model:
        description: 'Choose Model'
        required: true
        type: choice
        options:
          - 'gemini-2.5-flash'
          - 'gemini-1.5-pro'
        default: 'gemini-2.5-flash'
      build_check:
        description: 'Run build check?'
        required: false
        type: boolean
        default: true

jobs:
  run-builder:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python Environment (Fix for Aider)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & Aider via Pip
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat
          if [ -f package.json ]; then npm install; fi

      - name: Execute Automated Interactive Deployment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # حماية نص المهمة المدخل من قبلك داخل حاوية نصية معزولة
          cat << 'EOF' > ai_instructions.txt
          ${{ github.event.inputs.task_description }}

          CRITICAL TECHNICAL EXECUTION:
          1. Inspect project structure to locate the Next.js API handling directory.
          2. Establish a secure connection to Supabase and deploy the SQL migration to ensure the 'trade_knowledge_hub' table exists.
          3. Populate the table with the 19 required strategic trade data rows.
          4. Verify there are no compilation errors, then commit and push to master.
          EOF

          # تشغيل البوت المطور لقراءة التعليمات وتنفيذها فوراً
          aider --message-file ai_instructions.txt --auto-commit --yes

      - name: Execution Success Report
        run: |
          echo "=========================================================="
          echo "🎉 SUCCESS: The AI Builder has finished processing!"
          echo "🌍 Production URL: https://nile-key3.vercel.app/api/init-db"
          echo "=========================================================="
